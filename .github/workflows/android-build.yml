name: Build Ibadia Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve consistent Android signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-keystore-v1

      - name: Cache Gradle packages and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ hashFiles('pubspec.yaml', '.github/workflows/android-build.yml') }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-

      - name: Configure optional release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > ~/.android/release.jks
            echo "USE_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "USE_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Generate fresh Android Gradle wrapper
        run: flutter create . --platforms=android --org com.quranapp.malayalam && rm -f test/widget_test.dart

      - name: Configure resilient Gradle mirrors and HTTP limits
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-mirror.gradle <<'GRADLE'
          def rewriteMavenCentral = { repos ->
              if (repos == null) return
              repos.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def urlStr = repo.url?.toString() ?: ""
                      if (urlStr.startsWith("https://repo.maven.apache.org/maven2") ||
                          urlStr.startsWith("https://repo1.maven.org/maven2") ||
                          urlStr.startsWith("http://repo.maven.apache.org/maven2") ||
                          urlStr.startsWith("http://repo1.maven.org/maven2")) {
                          repo.url = "https://maven-central.storage-download.googleapis.com/maven2/"
                      }
                  }
              }
          }

          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = "https://maven-central.storage-download.googleapis.com/maven2/"
                  }
                  google()
                  gradlePluginPortal()
              }
              rewriteMavenCentral(settings.pluginManagement.repositories)
              rewriteMavenCentral(settings.dependencyResolutionManagement?.repositories)
          }

          gradle.allprojects { proj ->
              rewriteMavenCentral(proj.buildscript.repositories)
              rewriteMavenCentral(proj.repositories)
          }
          GRADLE

          python3 - <<'PY'
          from pathlib import Path

          mirror_line = '        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n'

          settings_path = Path("android/settings.gradle.kts")
          if settings_path.exists():
              s_text = settings_path.read_text()
              if "maven-central.storage-download.googleapis.com" not in s_text and "repositories {" in s_text:
                  s_text = s_text.replace("repositories {\n", "repositories {\n" + mirror_line, 1)
                  settings_path.write_text(s_text)

          build_path = Path("android/build.gradle.kts")
          if build_path.exists():
              b_text = build_path.read_text()
              if "maven-central.storage-download.googleapis.com" not in b_text and "repositories {" in b_text:
                  b_text = b_text.replace("repositories {\n", "repositories {\n" + mirror_line)
                  build_path.write_text(b_text)

          props_path = Path("android/gradle.properties")
          if props_path.exists():
              p_text = props_path.read_text()
              extra_props = [
                  "org.gradle.workers.max=2",
                  "systemProp.org.gradle.internal.http.connectionTimeout=120000",
                  "systemProp.org.gradle.internal.http.socketTimeout=120000",
                  "systemProp.http.maxConnections=4",
              ]
              additions = [line for line in extra_props if line not in p_text]
              if additions:
                  if not p_text.endswith("\n"):
                      p_text += "\n"
                  p_text += "\n".join(additions) + "\n"
                  props_path.write_text(p_text)
          PY

      - name: Apply Custom Android Manifest, FileProvider, Splash & Updater MainActivity
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/kotlin/com/quranapp/malayalam/quran_malayalam_app
          cp -r android_config/res/. android/app/src/main/res/
          cp android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_config/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp android_config/MainActivity.kt android/app/src/main/kotlin/com/quranapp/malayalam/quran_malayalam_app/MainActivity.kt

      - name: Configure release keystore signing if secret is present
        if: env.USE_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=${HOME}/.android/release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          signing_block = """import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
          if "keystorePropertiesFile" not in text:
              text = signing_block + "\n" + text
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  '''signingConfigs {
                      create("release") {
                          keyAlias = keystoreProperties.getProperty("keyAlias")
                          keyPassword = keystoreProperties.getProperty("keyPassword")
                          storeFile = file(keystoreProperties.getProperty("storeFile"))
                          storePassword = keystoreProperties.getProperty("storePassword")
                      }
                  }
                  signingConfig = signingConfigs.getByName("release")'''
              )
              p.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build Single Universal Release APK
        env:
          QURAN_API_KEY: ${{ secrets.QURAN_API_KEY }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: |
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          APK_LINK="https://github.com/${{ github.repository }}/releases/download/latest/Ibadia.apk"
          MANIFEST_LINK="https://github.com/${{ github.repository }}/releases/download/latest/version.json"
          SHARE_WEB_URL="${WEB_APP_URL:-https://ibadia.vercel.app}"
          BUILD_SUCCESS=0
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3..."
            if flutter build apk --release \
              --build-number="${BUILD_NUMBER}" \
              --dart-define=QURAN_API_KEY="${QURAN_API_KEY}" \
              --dart-define=ANDROID_APK_URL="${APK_LINK}" \
              --dart-define=WEB_APP_URL="${SHARE_WEB_URL}" \
              --dart-define=APP_BUILD_NUMBER="${BUILD_NUMBER}" \
              --dart-define=UPDATE_MANIFEST_URL="${MANIFEST_LINK}"; then
              BUILD_SUCCESS=1
              break
            fi
            echo "Attempt ${attempt} failed; waiting 20s before retry..."
            sleep 20
          done
          if [ "${BUILD_SUCCESS}" -ne 1 ]; then
            echo "ERROR: flutter build apk failed after 3 attempts."
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Ibadia.apk

          APP_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          cat > build/app/outputs/flutter-apk/version.json <<EOF
          {
            "version": "${APP_VERSION}",
            "buildNumber": ${BUILD_NUMBER},
            "apkUrl": "${APK_LINK}",
            "commit": "${{ github.sha }}",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Verify APK has launchable activity and valid icon
        run: |
          AAPT_BIN=$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name "aapt" | sort -V | tail -n 1)
          echo "Using aapt: ${AAPT_BIN}"
          BADGING=$("${AAPT_BIN}" dump badging build/app/outputs/flutter-apk/Ibadia.apk)
          echo "${BADGING}" | head -n 30
          echo "${BADGING}" | grep -q "launchable-activity:" || {
            echo "ERROR: APK does not contain a launchable-activity!"
            exit 1
          }

      - name: Publish Public Release APK & Update Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              build/app/outputs/flutter-apk/Ibadia.apk \
              build/app/outputs/flutter-apk/version.json \
              --clobber
          else
            gh release create latest \
              build/app/outputs/flutter-apk/Ibadia.apk \
              build/app/outputs/flutter-apk/version.json \
              --title "Ibadia Latest Android APK" \
              --notes "Latest automated Android release build (Ibadia.apk)."
          fi

      - name: Upload Single Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ibadia-APK
          path: build/app/outputs/flutter-apk/Ibadia.apk
