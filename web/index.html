  <link rel="icon" type="image/png" href="favicon.png">
  <title>Ibadia</title>
  <link rel="manifest" href="manifest.json">

  <script>
    (function () {
      var deferredPrompt = null;
      var notify = function () {
        window.dispatchEvent(new Event('ibadia-pwa-changed'));
        window.dispatchEvent(new Event('ibadia-install-ready'));
      };

      window.__ibadiaDeferredPrompt = null;
      window.__ibadiaPwa = {
        isIOS: function () {
          var ua = window.navigator.userAgent || '';
          return /iPhone|iPad|iPod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;
        },
        canInstall: function () {
          return deferredPrompt !== null;
        },
        isOnline: function () {
          return window.navigator.onLine !== false;
        },
        currentUrl: function () {
          return window.location.href || 'https://ibadia.vercel.app';
        },
        promptInstall: function () {
          if (!deferredPrompt) {
            return Promise.resolve('unavailable');
          }
          try {
            deferredPrompt.prompt();
            return deferredPrompt.userChoice.then(function (choice) {
              var outcome = (choice && choice.outcome) ? choice.outcome : 'dismissed';
              deferredPrompt = null;
              window.__ibadiaDeferredPrompt = null;
              notify();
              return outcome;
            }).catch(function () {
              return 'dismissed';
            });
          } catch (e) {
            return Promise.resolve('dismissed');
          }
        },
        openExternal: function (url) {
          if (!url) return false;
          try {
            var a = document.createElement('a');
            a.href = url;
            if (/\.apk(\?|$)/i.test(url)) {
              a.setAttribute('download', 'Ibadia.apk');
            }
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            return true;
          } catch (e) {
            try {
              var opened = window.open(url, '_blank', 'noopener,noreferrer');
              if (opened) return true;
              window.location.href = url;
              return true;
            } catch (_) {
              return false;
            }
          }
        },
        applyWebUpdate: function () {
          if ('serviceWorker' in navigator) {
            return navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg && reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              } else if (reg) {
                return reg.update().then(function () {
                  window.location.reload();
                  return true;
                });
              }
              window.location.reload();
              return true;
            }).catch(function () {
              window.location.reload();
              return true;
            });
          }
          window.location.reload();
          return Promise.resolve(true);
        }
      };

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        window.__ibadiaDeferredPrompt = e;
        notify();
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        window.__ibadiaDeferredPrompt = null;
        window.dispatchEvent(new Event('ibadia-app-installed'));
        notify();
      });
    })();
  </script>
