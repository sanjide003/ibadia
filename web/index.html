<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fast offline-cached Quran reader with Mushaf Page View, Verse List View, bi-directional continuous Surah scroll, flicker-free header, and draggable long-press speed auto-scroll.">
  <meta name="theme-color" content="#047857">
  <meta property="og:title" content="Al-Quran">
  <meta property="og:description" content="Fast offline-cached Quran reader with Mushaf Page View, Verse List View, bi-directional continuous Surah scroll, flicker-free header, and draggable long-press speed auto-scroll.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Al-Quran">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>Al-Quran</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #045A3D;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, #067852 0%, #045A3D 55%, #033D29 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.28s ease-out;
    }
    #app-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }
    #app-splash .splash-title {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    #app-splash .splash-spinner {
      margin-top: 18px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #F59E0B;
      animation: alqSpin 0.8s linear infinite;
    }
    @keyframes alqSpin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    (function () {
      var deferredPrompt = null;

      function isStandaloneMode() {
        return (
          (window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true
        );
      }

      function isIosDevice() {
        var ua = (window.navigator.userAgent || '').toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      }

      function notifyDart() {
        window.dispatchEvent(new CustomEvent('alquran-pwa-changed'));
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        notifyDart();
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        notifyDart();
      });

      window.__alQuranPwa = {
        canInstall: function () {
          return !!deferredPrompt && !isStandaloneMode();
        },
        isStandalone: function () {
          return isStandaloneMode();
        },
        isIOS: function () {
          return isIosDevice();
        },
        isOnline: function () {
          return window.navigator.onLine !== false;
        },
        currentUrl: function () {
          return window.location.origin || '';
        },
        promptInstall: function () {
          if (!deferredPrompt) {
            return Promise.resolve('unavailable');
          }
          var promptEvent = deferredPrompt;
          deferredPrompt = null;
          notifyDart();
          return promptEvent.prompt().then(function () {
            return promptEvent.userChoice.then(function (choice) {
              notifyDart();
              return choice && choice.outcome ? choice.outcome : 'dismissed';
            });
          });
        },
        openExternal: function (url) {
          if (!url) return false;
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          return true;
        },
        applyWebUpdate: function () {
          var clearCaches = (window.caches && caches.keys)
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            : Promise.resolve();

          var unregisterSw = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
            ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            : Promise.resolve();

          return Promise.all([clearCaches, unregisterSw]).then(function () {
            window.location.reload();
            return true;
          }).catch(function () {
            window.location.reload();
            return true;
          });
        }
      };
    })();
  </script>
</head>
<body>
  <div id="app-splash" aria-hidden="true">
    <img src="icons/Icon-192.png?v=2" alt="Al-Quran" />
    <div class="splash-title">Al-Quran</div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    (function () {
      function hideSplash() {
        var el = document.getElementById('app-splash');
        if (!el || el.dataset.hiding) return;
        el.dataset.hiding = '1';
        el.classList.add('hidden');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 320);
      }
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
      setTimeout(hideSplash, 10000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
