<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fast offline-cached Quran reader with Mushaf Page View, Verse List View, bi-directional continuous Surah scroll, flicker-free header, and draggable long-press speed auto-scroll.">
  <meta name="theme-color" content="#047857">
  <meta property="og:title" content="Al-Quran">
  <meta property="og:description" content="Fast offline-cached Quran reader with Mushaf Page View, Verse List View, bi-directional continuous Surah scroll, flicker-free header, and draggable long-press speed auto-scroll.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Al-Quran">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Al-Quran</title>
  <link rel="manifest" href="manifest.json">

  <script>
    (function () {
      var deferredPrompt = null;

      function isStandaloneMode() {
        return (
          (window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true
        );
      }

      function isIosDevice() {
        var ua = (window.navigator.userAgent || '').toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      }

      function notifyDart() {
        window.dispatchEvent(new CustomEvent('alquran-pwa-changed'));
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        notifyDart();
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        notifyDart();
      });

      window.__alQuranPwa = {
        canInstall: function () {
          return !!deferredPrompt && !isStandaloneMode();
        },
        isStandalone: function () {
          return isStandaloneMode();
        },
        isIOS: function () {
          return isIosDevice();
        },
        isOnline: function () {
          return window.navigator.onLine !== false;
        },
        currentUrl: function () {
          return window.location.origin || '';
        },
        promptInstall: function () {
          if (!deferredPrompt) {
            return Promise.resolve('unavailable');
          }
          var promptEvent = deferredPrompt;
          deferredPrompt = null;
          notifyDart();
          return promptEvent.prompt().then(function () {
            return promptEvent.userChoice.then(function (choice) {
              notifyDart();
              return choice && choice.outcome ? choice.outcome : 'dismissed';
            });
          });
        },
        openExternal: function (url) {
          if (!url) return false;
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          return true;
        },
        applyWebUpdate: function () {
          var clearCaches = (window.caches && caches.keys)
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            : Promise.resolve();

          var unregisterSw = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
            ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            : Promise.resolve();

          return Promise.all([clearCaches, unregisterSw]).then(function () {
            window.location.reload();
            return true;
          }).catch(function () {
            window.location.reload();
            return true;
          });
        }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
